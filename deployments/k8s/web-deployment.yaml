apiVersion: apps/v1
kind: Deployment
metadata:
  name: infra-orch-web
  namespace: infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infra-orch-web
  template:
    metadata:
      labels:
        app: infra-orch-web
    spec:
      containers:
        - name: web
          image: 10.10.0.190:32000/infra-orch-web:89a40e6
          imagePullPolicy: IfNotPresent
          env:
            - name: VITE_API_URL
              value: "/api"
          ports:
            - containerPort: 80
