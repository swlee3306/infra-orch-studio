apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: infra

resources:
  - ../../base
  - ../../../../k8s/mysql/base
  - ingress.yaml

images:
  - name: registry.example.invalid/infra-orch-studio
    newName: registry.example.invalid/infra-orch-studio
    newTag: stage
  - name: registry.example.invalid/infra-orch-web
    newName: registry.example.invalid/infra-orch-web
    newTag: stage

replicas:
  - name: infra-orch-api
    count: 1
  - name: infra-orch-runner
    count: 1
  - name: infra-orch-web
    count: 1
